# ============================================================
# AQI-VAR Forecasting Project Configuration
# ============================================================
# All key settings live here. Nothing important is hardcoded.

project:
  name: "Multivariate AQI Forecasting"
  random_seed: 42
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR

# ---- City Table (lat/lon for Open-Meteo) --------------------
cities:
  Delhi:
    latitude: 28.6139
    longitude: 77.2090
  Bhopal:
    latitude: 23.2599
    longitude: 77.4126
  Mumbai:
    latitude: 19.0760
    longitude: 72.8777
  Kolkata:
    latitude: 22.5726
    longitude: 88.3639
  Bengaluru:
    latitude: 12.9716
    longitude: 77.5946

default_city: Delhi

# ---- Date Range ---------------------------------------------
# The pipeline auto-detects the earliest available date.
# If start_date is before what the API offers, it shifts forward.
start_date: "2022-01-01"
end_date: "2025-09-30"

# ---- Frequency ----------------------------------------------
# daily | hourly
frequency: daily
seasonal_period_daily: 7
seasonal_period_hourly: 24

# ---- Variables -----------------------------------------------
pollutant_vars:
  - pm2_5
  - pm10
  - carbon_monoxide
  - nitrogen_dioxide
  - sulphur_dioxide
  - ozone

weather_vars:
  - temperature_2m
  - relative_humidity_2m
  - wind_speed_10m
  - wind_direction_10m
  - precipitation
  - surface_pressure

# Core VAR system (max 7 endogenous recommended)
var_endogenous:
  - log_pm2_5
  - log_pm10
  - log_no2
  - log_o3
  - temperature_2m
  - relative_humidity_2m
  - wind_speed_10m

var_exogenous:
  - precipitation
  - surface_pressure
  - diwali_window
  - winter
  - monsoon
  - weekend

# ---- Data Cleaning -------------------------------------------
interpolation_limit_days: 3
outlier_method: iqr        # iqr | zscore
iqr_multiplier: 3.0
zscore_threshold: 4.0
missing_warn_threshold: 0.15   # warn if > 15% missing

# ---- Modelling -----------------------------------------------
var_max_lags: 14

# SARIMA AIC grid search (small grid to keep runtime sane)
sarima_grid:
  p_range: [0, 1, 2]
  d_range: [0, 1]
  q_range: [0, 1, 2]
  P_range: [0, 1]
  D_range: [0, 1]
  Q_range: [0, 1]

# Evaluation
eval_initial_train_frac: 0.70
eval_step_days: 7
eval_horizons: [1, 3, 7]

# Uncertainty / bootstrap
n_bootstrap: 100
bootstrap_block_length: 14  # for moving-block bootstrap
prediction_intervals: [80, 95]

# LightGBM
lgbm_params:
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  verbose: -1

lgbm_lag_features: [1, 2, 3, 7, 14]

# ---- Events / Holidays (verify dates!) -----------------------
# Diwali dates – VERIFY against the actual Hindu calendar
events:
  diwali:
    - "2022-10-24"
    - "2023-11-12"
    - "2024-11-01"
    - "2025-10-20"
    - "2026-11-08"
  holi:
    - "2022-03-18"
    - "2023-03-08"
    - "2024-03-25"
    - "2025-03-14"
    - "2026-03-04"
  diwali_window_before: 2   # days before Diwali
  diwali_window_after: 5    # days after Diwali

# Season definitions (month numbers)
seasons:
  winter: [11, 12, 1, 2]
  monsoon: [6, 7, 8, 9]

# ---- API retry settings -------------------------------------
api:
  max_retries: 5
  backoff_base: 2.0
  chunk_years: 1            # request in 1-year chunks

# ---- CPCB column mapping (for user-supplied CSVs) -----------
cpcb_column_map:
  "PM2.5": pm2_5
  "PM 2.5": pm2_5
  "pm2.5": pm2_5
  "PM10": pm10
  "pm10": pm10
  "NO2": nitrogen_dioxide
  "no2": nitrogen_dioxide
  "SO2": sulphur_dioxide
  "so2": sulphur_dioxide
  "CO": carbon_monoxide
  "co": carbon_monoxide
  "O3": ozone
  "Ozone": ozone
  "AQI": us_aqi
  "Date": date
  "date": date
  "Datetime": date
  "datetime": date
